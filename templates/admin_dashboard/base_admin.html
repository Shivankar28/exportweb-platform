{% extends 'base.html' %}

{% block title %}Admin Control Panel | GlobalExportHub{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row g-4">
        <!-- Admin Sidebar -->
        <div class="col-lg-3 col-xl-2">
            <div class="card card-custom p-3 sticky-top" style="top: 90px;">
                <div class="text-center pb-3 mb-3 border-bottom">
                    <div class="rounded-circle bg-dark text-warning d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h6 class="fw-bold mb-0">Platform Admin</h6>
                    <small class="text-muted">Global Control Center</small>
                </div>

                <div class="nav flex-column nav-pills gap-1">
                    <a href="{{ url_for('admin.dashboard') }}" class="nav-link text-start {% if request.endpoint == 'admin.dashboard' %}active bg-dark text-warning{% else %}text-dark{% endif %}">
                        <i class="bi bi-speedometer2 me-2"></i> Overview
                    </a>
                    <a href="{{ url_for('admin.sellers') }}" class="nav-link text-start {% if request.endpoint == 'admin.sellers' or request.endpoint == 'admin.seller_detail' %}active bg-dark text-warning{% else %}text-dark{% endif %}">
                        <i class="bi bi-building-check me-2"></i> Seller Approval
                    </a>
                    <a href="{{ url_for('admin.categories') }}" class="nav-link text-start {% if request.endpoint == 'admin.categories' %}active bg-dark text-warning{% else %}text-dark{% endif %}">
                        <i class="bi bi-tags me-2"></i> Categories
                    </a>
                    <a href="{{ url_for('admin.products') }}" class="nav-link text-start {% if request.endpoint == 'admin.products' %}active bg-dark text-warning{% else %}text-dark{% endif %}">
                        <i class="bi bi-box-seam me-2"></i> Products Catalog
                    </a>
                    <a href="{{ url_for('admin.enquiries') }}" class="nav-link text-start {% if request.endpoint == 'admin.enquiries' %}active bg-dark text-warning{% else %}text-dark{% endif %}">
                        <i class="bi bi-envelope-paper me-2"></i> Global RFQs
                    </a>
                </div>
            </div>
        </div>

        <!-- Admin Content Body -->
        <div class="col-lg-9 col-xl-10">
            {% block admin_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
