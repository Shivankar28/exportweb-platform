{% extends 'base.html' %}

{% block title %}Sign In | GlobalExportHub Exporter Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="card card-custom p-4 p-md-5 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-warning bg-opacity-10 text-warning d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                        <i class="bi bi-box-arrow-in-right fs-2"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Exporter & Admin Sign In</h3>
                    <p class="small text-muted">Access your company portfolio, product catalog, & buyer RFQs.</p>
                </div>

                <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Work Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="exporter@company.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold mb-0">Password</label>
                            <a href="#" class="small text-decoration-none text-muted">Forgot password?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" name="remember" class="form-check-input" id="rememberCheck">
                        <label class="form-check-label small text-muted" for="rememberCheck">Remember this session</label>
                    </div>

                    <button type="submit" class="btn btn-navy w-100 py-2.5 rounded-3 fw-bold mb-3">
                        Sign In to Exporter Portal
                    </button>

                    <div class="text-center small text-muted">
                        Don't have an exporter account yet? 
                        <a href="{{ url_for('auth.register') }}" class="text-warning fw-bold text-decoration-none">Register Company Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
